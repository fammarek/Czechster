<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#C9A227">
<title>Czechster</title>
<style>
  @font-face{font-family:"Archivo Black";src:url(schrift/archivo-black-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"Archivo Black";src:url(schrift/archivo-black-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:"Noto Sans";font-weight:400;src:url(schrift/noto-sans-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"Noto Sans";font-weight:400;src:url(schrift/noto-sans-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-024F,U+1E00-1EFF}
  @font-face{font-family:"Noto Sans";font-weight:700;src:url(schrift/noto-sans-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"Noto Sans";font-weight:700;src:url(schrift/noto-sans-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-024F,U+1E00-1EFF}

  /* Farben der Kartenvorderseite */
  :root{--ocker:#C9A227;--dunkel:#A8841E;--licht:#E3C25A;--ink:#1A1A1A;--creme:#FAF1D6;--r:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;color:var(--ink);background-color:var(--ocker);
    background-image:radial-gradient(circle,var(--dunkel) 0 1.1px,transparent 1.6px);background-size:9px 9px;
    font:16px/1.45 "Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 14px) 26px calc(env(safe-area-inset-bottom) + 14px);
    overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  /* Doppelrahmen wie auf der Karte */
  body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:1}
  body::before{inset:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);border:2px solid var(--ink);border-radius:22px}
  body::after{inset:calc(env(safe-area-inset-top) + 13px) 13px calc(env(safe-area-inset-bottom) + 13px);border:1px solid var(--ink);border-radius:17px}

  header{position:relative;padding:14px 0 4px;text-align:center}
  h1{margin:0;font:400 clamp(30px,9.5vw,42px)/1 "Archivo Black",sans-serif;letter-spacing:.01em}
  .zier{display:flex;align-items:center;justify-content:center;gap:8px;margin:9px auto 0;max-width:260px}
  .zier::before,.zier::after{content:"";flex:1;height:5px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
  .zier i{width:9px;height:9px;background:var(--ink);transform:rotate(45deg);box-shadow:0 0 0 2px var(--ocker),0 0 0 3px var(--ink)}
  #count{display:block;margin-top:6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-variant-numeric:tabular-nums}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-bottom:6px}
  .btn{display:block;width:100%;border:0;border-radius:var(--r);font:400 19px/1 "Archivo Black",sans-serif;letter-spacing:.02em;
    padding:21px 18px;color:var(--licht);background:var(--ink);
    box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px var(--licht);transition:transform .08s ease}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--creme);color:var(--ink);font:700 16px/1 "Noto Sans",sans-serif;padding:16px;
    box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 5px var(--creme),inset 0 0 0 6px var(--ink)}

  /* Plattenteller: liegt ueber dem Player und verdeckt ihn vollstaendig */
  .stage{position:relative;aspect-ratio:1;margin:0 auto;width:min(76vw,340px,44vh);border-radius:50%;
    background:repeating-conic-gradient(from 0deg,var(--ink) 0 3deg,var(--licht) 3deg 7.5deg);
    box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--ocker),0 0 0 9px var(--ink)}
  .stage::after{content:"";position:absolute;inset:6.5%;border-radius:50%;background:var(--ocker);box-shadow:0 0 0 2px var(--ink)}
  #ytBox{position:absolute;inset:0;opacity:.001;pointer-events:none;border-radius:50%;overflow:hidden}
  .disc{position:absolute;inset:9.5%;border-radius:50%;z-index:2;display:grid;place-items:center;
    background:repeating-radial-gradient(circle at 50% 50%,#1A1A1A 0 2px,#2a2620 2px 3px,#1A1A1A 3px 5px);
    box-shadow:0 0 0 2px var(--ink)}
  .disc::before{content:"";position:absolute;width:36%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,var(--ocker) 0 58%,var(--ink) 58% 62%,var(--licht) 62% 100%)}
  .disc::after{content:"";position:absolute;width:13%;aspect-ratio:1;background:var(--ink);transform:rotate(45deg);
    box-shadow:0 0 0 3px var(--ocker),0 0 0 4.5px var(--ink)}
  .disc i{position:absolute;top:7%;left:49%;width:2%;height:22%;background:#E3C25A33;border-radius:2px}
  .stage.zu{position:absolute;left:-200vw}   /* nicht display:none, sonst stoppt der Player */
  .stage.spin .disc{animation:spin 3.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.stage.spin .disc{animation:none}}
  #stageLbl{text-align:center;font:700 12px/1 "Noto Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;min-height:13px}

  /* Aufloesung: die Rueckseite der Karte mit dem Jahrzehnt-Motiv */
  #reveal{display:flex;flex-direction:column;align-items:center;gap:8px}
  .karte{position:relative;width:min(70vw,290px,calc(50vh * 59 / 91));aspect-ratio:59/91;border-radius:8.5%/5.5%;overflow:hidden;
    container-type:inline-size;box-shadow:0 0 0 2px var(--ink),0 14px 30px -14px #000a;background:#fff}
  .karte img{position:absolute;width:110.17%;left:-5.08%;top:-3.3%;height:auto;display:block}
  .satz{position:absolute;left:8.47%;width:83.05%;top:20.88%;bottom:19.5%;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--ink)}
  #year{font:400 27.97cqw/1 "Archivo Black",sans-serif;letter-spacing:-.4cqw;font-variant-numeric:tabular-nums}
  #artist{font:700 8.97cqw/1.2 "Noto Sans",sans-serif;margin-top:5.93cqw}
  #title{font:400 7.18cqw/1.25 "Noto Sans",sans-serif;margin-top:2.71cqw}
  #kcode{position:absolute;left:0;right:0;bottom:18.5%;text-align:center;font:400 5.08cqw/1 "Noto Sans",sans-serif;opacity:.7}
  #warn{font-size:13px;font-weight:700;background:var(--creme);padding:4px 10px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--ink)}
  #warn:empty{display:none}

  #scanWrap{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #scanWrap.on{display:block}
  #cam{width:100%;height:100%;object-fit:cover}
  #reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:64vw;max-width:340px;aspect-ratio:1;border:3px solid var(--ocker);border-radius:24px;
    box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000}
  #scanUI{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 24px)}
  #scanMsg{color:#fff;text-align:center;font-size:15px;text-shadow:0 2px 8px #000;margin:0 0 14px}

  .row{display:flex;gap:10px}.row>*{flex:1}
  .hide{display:none !important}
  #err{background:var(--creme);border-radius:12px;padding:14px;font-size:14px;box-shadow:inset 0 0 0 2px #8A3C00}
  #err a{color:var(--ink)}
  footer{padding:4px 0 10px;text-align:center;font-size:12px;font-weight:700}
</style>
</head>
<body>
<header><h1>Czechster</h1><div class="zier"><i></i></div><span id="count"></span></header>

<main>
  <div class="stage" id="stage">
    <div id="ytBox"><div id="yt"></div></div>
    <div class="disc"><i></i></div>
  </div>
  <div id="stageLbl">bereit</div>

  <div id="reveal" class="hide">
    <div class="karte"><img id="motiv" alt="">
      <div class="satz"><div id="year"></div><div id="artist"></div><div id="title"></div></div>
      <div id="kcode"></div></div>
    <div id="warn"></div>
  </div>
  <div id="err" class="hide"></div>

  <button class="btn" id="main">Karte scannen</button>
  <div class="row hide" id="controls">
    <button class="btn ghost" id="toggle">Pause</button>
    <button class="btn ghost" id="revealBtn">Auflösen</button>
  </div>
</main>

<footer>Ein Handy scannt und spielt — reihum weitergeben.</footer>

<div id="scanWrap">
  <video id="cam" playsinline muted></video>
  <div id="reticle"></div>
  <div id="scanUI">
    <p id="scanMsg">QR-Code der Karte ins Feld halten</p>
    <button class="btn ghost" id="cancelScan">Abbrechen</button>
  </div>
</div>

<script src="jsQR.js"></script><!-- jsQR 1.4.0 (Apache-2.0), lokal statt CDN -->
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var stage=$("stage"), lbl=$("stageLbl"), mainBtn=$("main"), controls=$("controls"),
      revealBox=$("reveal"), errBox=$("err");

  var songs={}, loaded=false;
  var apiReady=false, player=null, playerReady=false;
  var current=null;      // Song, der gerade gespielt werden soll
  var unlocking=false;   // stummes Vorab-Starten, damit iOS spaetere Starts erlaubt
  var wantPlay=null;     // Song, der gespielt werden soll, sobald der Player bereit ist
  var watchdog=null;

  /* ---------- Daten ---------- */
  fetch("songs.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    for(var k in d){ if(k.charAt(0)!=="_") songs[k]=d[k]; }
    loaded=true;
    // Rueckseiten-Motiv wie in tools/druckdateien.js: je Jahrzehnt nach Jahr/Code sortiert abwechselnd 1, 2
    var liste=[]; for(var c0 in songs){ var x=songs[c0]; if(x.ok&&x.v&&x.j) liste.push(c0); }
    liste.sort(function(a,b){ return songs[a].j-songs[b].j||a.localeCompare(b); });
    var zl={}; liste.forEach(function(c1){ var d=String(Math.floor(songs[c1].j/10)*10).slice(2); zl[d]=(zl[d]||0)+1;
      songs[c1].motiv="hinten_"+d+"_"+(zl[d]%2?1:2); });
    var n=0; for(var c in songs){ if(songs[c].v) n++; }
    $("count").textContent=n+" Karten";
    var h=hashCode();
    if(h){                       // ueber die iOS-Kamera geoeffnet: es fehlt noch die Tipp-Geste
      mainBtn.textContent="▶ Abspielen";
      mainBtn.onclick=function(){ mainBtn.onclick=scanClick; play(h); };
    }
  }).catch(function(){ fail("songs.json konnte nicht geladen werden."); });

  function hashCode(){ return normalise(location.hash.replace(/^#/,"")); }

  /* ---------- YouTube ---------- */
  var tag=document.createElement("script");
  tag.src="https://www.youtube.com/iframe_api";
  tag.onerror=function(){ fail("YouTube ist nicht erreichbar — besteht eine Internetverbindung?"); };
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){ apiReady=true; if(wantPlay||unlocking) build(); };

  function build(){
    if(player||!apiReady) return;
    var first=wantPlay||firstSong();
    if(!first) return;
    player=new YT.Player("yt",{
      height:"360",width:"360",videoId:first.v,
      playerVars:{playsinline:1,controls:0,rel:0,disablekb:1,fs:0,iv_load_policy:3,start:first.t||0},
      events:{onReady:onReady,onError:onError,onStateChange:onState}
    });
  }
  function firstSong(){ for(var c in songs){ if(songs[c].v) return songs[c]; } return null; }

  function onReady(){
    playerReady=true;
    if(wantPlay){ var s=wantPlay; wantPlay=null; start(s); }
    else if(unlocking){ player.mute(); player.playVideo(); }
  }
  function onState(e){
    var S=YT.PlayerState;
    if(unlocking){
      if(e.data===S.PLAYING){ player.pauseVideo(); unlocking=false; }
      return;
    }
    if(e.data===S.PLAYING){ clearTimeout(watchdog); stage.classList.add("spin"); lbl.textContent="läuft"; $("toggle").textContent="Pause"; stage.onclick=null; }
    else if(e.data===S.PAUSED){ stage.classList.remove("spin"); lbl.textContent="pause"; $("toggle").textContent="Weiter"; }
    else if(e.data===S.ENDED){ stage.classList.remove("spin"); lbl.textContent="ende"; }
  }
  function onError(e){
    if(unlocking){ unlocking=false; return; }
    clearTimeout(watchdog);
    stage.classList.remove("spin"); lbl.textContent="blockiert";
    var n=e.data, why=(n===101||n===150)?"Der Rechteinhaber hat das Einbetten gesperrt"
      :(n===100)?"Das Video wurde entfernt oder ist privat":"Wiedergabefehler "+n;
    fail(why+". Diese Karte auslassen und in der Redaktion eine andere Aufnahme eintragen.");
  }

  /* ---------- Abspielen ---------- */
  function normalise(raw){
    raw=(raw||"").trim();
    var m=raw.match(/#([A-Za-z0-9_-]{1,12})$/);            // volle URL aus dem QR
    return m?m[1]:raw;
  }

  function play(code){
    hide(errBox); hide(revealBox); stage.classList.remove("zu"); lbl.classList.remove("hide");
    if(!loaded){ setTimeout(function(){play(code)},200); return; }
    var s=songs[code];
    if(!s){ fail("Der Code <b>"+esc(code)+"</b> gehört zu keiner Karte dieses Spiels."); return; }
    if(!s.v){ fail("Für <b>"+esc(code)+"</b> ist noch kein Video eingetragen."); return; }
    current=s; current.code=code;
    history.replaceState(null,"","#"+code);
    controls.classList.remove("hide");
    mainBtn.textContent="Nächste Karte scannen";
    lbl.textContent="lädt";
    stage.classList.remove("spin");
    if(!player){ wantPlay=s; build(); return; }       // Player entsteht direkt mit diesem Song
    if(!playerReady){ wantPlay=s; return; }           // onReady uebernimmt
    start(s);
  }

  function start(s){
    unlocking=false;
    player.unMute(); player.setVolume(100);
    player.loadVideoById({videoId:s.v,startSeconds:s.t||0});
    clearTimeout(watchdog);
    watchdog=setTimeout(function(){
      var st=player.getPlayerState?player.getPlayerState():-1;
      if(st!==YT.PlayerState.PLAYING&&st!==YT.PlayerState.BUFFERING){
        lbl.textContent="Plattenteller antippen";
        stage.onclick=function(){ player.unMute(); player.playVideo(); };
      }
    },1800);
  }

  /* ---------- Bedienung ---------- */
  $("toggle").onclick=function(){
    if(!playerReady) return;
    if(player.getPlayerState()===YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
  };
  $("revealBtn").onclick=function(){
    if(!current) return;
    var s=current, d=s.j?String(Math.floor(s.j/10)*10).slice(2):null;
    $("motiv").src="design/motive/"+(s.motiv||(d?"hinten_"+d+"_1":"hinten_80_1"))+".svg";
    $("year").textContent=s.j||"—";
    $("artist").textContent=s.i||"";
    $("title").textContent=s.n||"";
    $("kcode").textContent=s.code||"";
    $("warn").textContent=s.ok?"":"Jahr noch nicht geprüft";
    stage.classList.add("zu"); lbl.classList.add("hide");
    revealBox.classList.remove("hide");
    // wie im Druck: Interpret und Titel hoechstens zwei Zeilen, notfalls kleiner
    [["artist",8.97],["title",7.18]].forEach(function(p){
      var e=$(p[0]), f=p[1], lh=function(){ return parseFloat(getComputedStyle(e).lineHeight); };
      e.style.fontSize="";
      while(e.offsetHeight>lh()*2.2&&f>6){ f-=0.3; e.style.fontSize=f+"cqw"; }
    });
  };

  /* ---------- Scanner ---------- */
  var wrap=$("scanWrap"), cam=$("cam"), stream=null, raf=null,
      cv=document.createElement("canvas"), ctx=cv.getContext("2d",{willReadFrequently:true});

  function scanClick(){
    // Die Tipp-Geste nutzen: Player stumm anspielen, damit iOS den Start nach dem Scan zulaesst
    if(!player&&apiReady&&loaded){ unlocking=true; build(); }
    startScan();
  }
  mainBtn.onclick=scanClick;
  $("cancelScan").onclick=stopScan;

  // Eingebauter Erkenner (Android/Chrome), sonst jsQR
  var detector=null;
  try{ if("BarcodeDetector" in window) detector=new BarcodeDetector({formats:["qr_code"]}); }catch(e){ detector=null; }
  var busy=false, frame=0;

  function startScan(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      fail("Dieser Browser gibt die Kamera nicht frei. Scanne mit der Kamera-App, der Link öffnet diese Seite."); return;
    }
    if(!window.jsQR&&!detector){ fail("Der QR-Leser konnte nicht geladen werden. Seite neu laden oder mit der Kamera-App scannen."); return; }
    hide(errBox);
    $("scanMsg").textContent="QR-Code der Karte ins Feld halten";
    wrap.classList.add("on");
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})
      .then(function(st){ stream=st; cam.srcObject=st; cam.play(); raf=requestAnimationFrame(tick); })
      .catch(function(){ stopScan(); fail("Kein Kamerazugriff. In Safari: „aA“ in der Adresszeile → Website-Einstellungen → Kamera erlauben."); });
  }
  function stopScan(){
    if(raf) cancelAnimationFrame(raf); raf=null;
    if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
    wrap.classList.remove("on");
  }
  function treffer(text){
    var code=normalise(text);
    if(songs[code]){ if(navigator.vibrate) navigator.vibrate(30); stopScan(); play(code); return true; }
    $("scanMsg").textContent="Dieser Code gehört nicht zum Spiel";
    return false;
  }
  // jsQR abwechselnd auf das ganze Bild und auf die Bildmitte (vergrößert) anwenden
  function leseJsQR(){
    var w=cam.videoWidth,h=cam.videoHeight; if(!w||!h) return null;
    var ganz=(frame%2===0), side=Math.min(w,h)*(ganz?1:0.6), sx=(w-side)/2, sy=(h-side)/2, sw=side, sh=side, n=640;
    if(ganz){ sx=0; sy=0; sw=w; sh=h; }
    var s=Math.min(1,n/Math.max(sw,sh)); cv.width=Math.round(sw*s); cv.height=Math.round(sh*s);
    ctx.drawImage(cam,sx,sy,sw,sh,0,0,cv.width,cv.height);
    var hit=jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:(frame%6===5)?"attemptBoth":"dontInvert"});
    return hit&&hit.data?hit.data:null;
  }
  function tick(){
    raf=null;
    if(!stream) return;
    if(cam.readyState>=cam.HAVE_CURRENT_DATA&&!busy){
      frame++;
      if(detector&&frame%2===0){
        busy=true;
        detector.detect(cam).then(function(r){ busy=false; if(r&&r.length&&treffer(r[0].rawValue)) return; if(stream&&!raf) raf=requestAnimationFrame(tick); })
          .catch(function(){ busy=false; detector=null; if(stream&&!raf) raf=requestAnimationFrame(tick); });
        return;
      }
      if(window.jsQR){ var t=leseJsQR(); if(t&&treffer(t)) return; }
    }
    raf=requestAnimationFrame(tick);
  }

  function fail(html){ errBox.innerHTML=html; errBox.classList.remove("hide"); }
  function hide(el){ el.classList.add("hide"); }
  function esc(s){ return String(s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]}); }
})();
</script>
</body>
</html>
