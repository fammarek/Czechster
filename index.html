<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>Czechster</title>
<style>
  :root{--bg:#101418;--line:#2a333c;--fg:#eef2f5;--dim:#8d9aa6;--accent:#e0533d;--r:16px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  header{padding:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--dim);font-weight:600}
  #count{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-bottom:12px}
  .btn{display:block;width:100%;border:0;border-radius:var(--r);font-family:inherit;font-weight:600;font-size:19px;line-height:1;
    padding:22px 18px;color:#fff;background:var(--accent);transition:transform .08s ease}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-size:16px;padding:16px}

  /* Plattenteller: liegt ueber dem Player und verdeckt ihn vollstaendig */
  .stage{position:relative;aspect-ratio:1;margin:0 auto;width:min(78vw,340px,46vh);
    border-radius:50%;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px -20px #000}
  #ytBox{position:absolute;inset:0;opacity:.001;pointer-events:none}
  .disc{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
    background:repeating-radial-gradient(circle at 50% 50%,#1c2228 0 2px,#151a20 2px 4px)}
  .disc::before{content:"";position:absolute;width:32%;aspect-ratio:1;border-radius:50%;background:var(--accent)}
  .disc::after{content:"";position:absolute;width:4%;aspect-ratio:1;border-radius:50%;background:var(--bg)}
  .disc i{position:absolute;top:8%;left:49%;width:2%;height:20%;background:#ffffff14;border-radius:2px}
  .stage.spin .disc{animation:spin 3.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.stage.spin .disc{animation:none}}
  #stageLbl{text-align:center;font-family:inherit;font-weight:600;font-size:13px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-height:14px}

  #scanWrap{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #scanWrap.on{display:block}
  #cam{width:100%;height:100%;object-fit:cover}
  #reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:64vw;max-width:340px;aspect-ratio:1;border:2px solid #fff6;border-radius:24px}
  #scanUI{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 24px)}
  #scanMsg{color:#fff;text-align:center;font-size:15px;text-shadow:0 2px 8px #000;margin:0 0 14px}

  .row{display:flex;gap:10px}.row>*{flex:1}
  #reveal{text-align:center;display:flex;flex-direction:column;gap:4px}
  #year{font-family:inherit;font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #meta{font-size:14px;color:var(--dim)}
  #warn{font-size:12px;color:#e0a13d}
  .hide{display:none !important}
  #err{background:#3a1f1c;border:1px solid #6b3027;border-radius:12px;padding:14px;font-size:14px}
  #err a{color:var(--fg)}
  footer{padding:10px 0 16px;text-align:center;font-size:12px;color:#5c6973}
</style>
</head>
<body>
<header><h1>Czechster</h1><span id="count"></span></header>

<main>
  <div class="stage" id="stage">
    <div id="ytBox"><div id="yt"></div></div>
    <div class="disc"><i></i></div>
  </div>
  <div id="stageLbl">bereit</div>

  <div id="reveal" class="hide"><div id="year"></div><div id="meta"></div><div id="warn"></div></div>
  <div id="err" class="hide"></div>

  <button class="btn" id="main">Karte scannen</button>
  <div class="row hide" id="controls">
    <button class="btn ghost" id="toggle">Pause</button>
    <button class="btn ghost" id="revealBtn">Auflösen</button>
  </div>
</main>

<footer>Ein Handy scannt und spielt — reihum weitergeben.</footer>

<div id="scanWrap">
  <video id="cam" playsinline muted></video>
  <div id="reticle"></div>
  <div id="scanUI">
    <p id="scanMsg">QR-Code der Karte ins Feld halten</p>
    <button class="btn ghost" id="cancelScan" style="background:#0009">Abbrechen</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var stage=$("stage"), lbl=$("stageLbl"), mainBtn=$("main"), controls=$("controls"),
      revealBox=$("reveal"), errBox=$("err");

  var songs={}, loaded=false;
  var apiReady=false, player=null, playerReady=false;
  var current=null;      // Song, der gerade gespielt werden soll
  var unlocking=false;   // stummes Vorab-Starten, damit iOS spaetere Starts erlaubt
  var wantPlay=null;     // Song, der gespielt werden soll, sobald der Player bereit ist
  var watchdog=null;

  /* ---------- Daten ---------- */
  fetch("songs.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    for(var k in d){ if(k.charAt(0)!=="_") songs[k]=d[k]; }
    loaded=true;
    var n=0; for(var c in songs){ if(songs[c].v) n++; }
    $("count").textContent=n+" Karten";
    var h=hashCode();
    if(h){                       // ueber die iOS-Kamera geoeffnet: es fehlt noch die Tipp-Geste
      mainBtn.textContent="▶ Abspielen";
      mainBtn.onclick=function(){ mainBtn.onclick=scanClick; play(h); };
    }
  }).catch(function(){ fail("songs.json konnte nicht geladen werden."); });

  function hashCode(){ return normalise(location.hash.replace(/^#/,"")); }

  /* ---------- YouTube ---------- */
  var tag=document.createElement("script");
  tag.src="https://www.youtube.com/iframe_api";
  tag.onerror=function(){ fail("YouTube ist nicht erreichbar — besteht eine Internetverbindung?"); };
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){ apiReady=true; if(wantPlay||unlocking) build(); };

  function build(){
    if(player||!apiReady) return;
    var first=wantPlay||firstSong();
    if(!first) return;
    player=new YT.Player("yt",{
      height:"360",width:"360",videoId:first.v,
      playerVars:{playsinline:1,controls:0,rel:0,disablekb:1,fs:0,iv_load_policy:3,start:first.t||0},
      events:{onReady:onReady,onError:onError,onStateChange:onState}
    });
  }
  function firstSong(){ for(var c in songs){ if(songs[c].v) return songs[c]; } return null; }

  function onReady(){
    playerReady=true;
    if(wantPlay){ var s=wantPlay; wantPlay=null; start(s); }
    else if(unlocking){ player.mute(); player.playVideo(); }
  }
  function onState(e){
    var S=YT.PlayerState;
    if(unlocking){
      if(e.data===S.PLAYING){ player.pauseVideo(); unlocking=false; }
      return;
    }
    if(e.data===S.PLAYING){ clearTimeout(watchdog); stage.classList.add("spin"); lbl.textContent="läuft"; $("toggle").textContent="Pause"; stage.onclick=null; }
    else if(e.data===S.PAUSED){ stage.classList.remove("spin"); lbl.textContent="pause"; $("toggle").textContent="Weiter"; }
    else if(e.data===S.ENDED){ stage.classList.remove("spin"); lbl.textContent="ende"; }
  }
  function onError(e){
    if(unlocking){ unlocking=false; return; }
    clearTimeout(watchdog);
    stage.classList.remove("spin"); lbl.textContent="blockiert";
    var n=e.data, why=(n===101||n===150)?"Der Rechteinhaber hat das Einbetten gesperrt"
      :(n===100)?"Das Video wurde entfernt oder ist privat":"Wiedergabefehler "+n;
    fail(why+". Diese Karte auslassen und in der Redaktion eine andere Aufnahme eintragen.");
  }

  /* ---------- Abspielen ---------- */
  function normalise(raw){
    raw=(raw||"").trim();
    var m=raw.match(/#([A-Za-z0-9_-]{1,12})$/);            // volle URL aus dem QR
    return m?m[1]:raw;
  }

  function play(code){
    hide(errBox); hide(revealBox);
    if(!loaded){ setTimeout(function(){play(code)},200); return; }
    var s=songs[code];
    if(!s){ fail("Der Code <b>"+esc(code)+"</b> gehört zu keiner Karte dieses Spiels."); return; }
    if(!s.v){ fail("Für <b>"+esc(code)+"</b> ist noch kein Video eingetragen."); return; }
    current=s;
    history.replaceState(null,"","#"+code);
    controls.classList.remove("hide");
    mainBtn.textContent="Nächste Karte scannen";
    lbl.textContent="lädt";
    stage.classList.remove("spin");
    if(!player){ wantPlay=s; build(); return; }       // Player entsteht direkt mit diesem Song
    if(!playerReady){ wantPlay=s; return; }           // onReady uebernimmt
    start(s);
  }

  function start(s){
    unlocking=false;
    player.unMute(); player.setVolume(100);
    player.loadVideoById({videoId:s.v,startSeconds:s.t||0});
    clearTimeout(watchdog);
    watchdog=setTimeout(function(){
      var st=player.getPlayerState?player.getPlayerState():-1;
      if(st!==YT.PlayerState.PLAYING&&st!==YT.PlayerState.BUFFERING){
        lbl.textContent="Plattenteller antippen";
        stage.onclick=function(){ player.unMute(); player.playVideo(); };
      }
    },1800);
  }

  /* ---------- Bedienung ---------- */
  $("toggle").onclick=function(){
    if(!playerReady) return;
    if(player.getPlayerState()===YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
  };
  $("revealBtn").onclick=function(){
    if(!current) return;
    $("year").textContent=current.j||"—";
    $("meta").textContent=[current.i,current.n].filter(Boolean).join(" · ")||"keine Angaben hinterlegt";
    $("warn").textContent=current.ok?"":"Jahr noch nicht geprüft";
    revealBox.classList.remove("hide");
  };

  /* ---------- Scanner ---------- */
  var wrap=$("scanWrap"), cam=$("cam"), stream=null, raf=null,
      cv=document.createElement("canvas"), ctx=cv.getContext("2d",{willReadFrequently:true});

  function scanClick(){
    // Die Tipp-Geste nutzen: Player stumm anspielen, damit iOS den Start nach dem Scan zulaesst
    if(!player&&apiReady&&loaded){ unlocking=true; build(); }
    startScan();
  }
  mainBtn.onclick=scanClick;
  $("cancelScan").onclick=stopScan;

  function startScan(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      fail("Dieser Browser gibt die Kamera nicht frei. Scanne mit der Kamera-App, der Link öffnet diese Seite."); return;
    }
    hide(errBox);
    wrap.classList.add("on");
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})
      .then(function(st){ stream=st; cam.srcObject=st; cam.play(); raf=requestAnimationFrame(tick); })
      .catch(function(){ stopScan(); fail("Kein Kamerazugriff. In Safari: „aA“ in der Adresszeile → Website-Einstellungen → Kamera erlauben."); });
  }
  function stopScan(){
    if(raf) cancelAnimationFrame(raf); raf=null;
    if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
    wrap.classList.remove("on");
  }
  function tick(){
    if(cam.readyState===cam.HAVE_ENOUGH_DATA&&window.jsQR){
      var w=cam.videoWidth,h=cam.videoHeight,side=Math.min(w,h)*0.7;
      cv.width=cv.height=420;
      ctx.drawImage(cam,(w-side)/2,(h-side)/2,side,side,0,0,420,420);
      var hit=jsQR(ctx.getImageData(0,0,420,420).data,420,420,{inversionAttempts:"dontInvert"});
      if(hit&&hit.data){
        var code=normalise(hit.data);
        if(songs[code]){ if(navigator.vibrate) navigator.vibrate(30); stopScan(); play(code); return; }
        $("scanMsg").textContent="Dieser Code gehört nicht zum Spiel";
      }
    }
    raf=requestAnimationFrame(tick);
  }

  function fail(html){ errBox.innerHTML=html; errBox.classList.remove("hide"); }
  function hide(el){ el.classList.add("hide"); }
  function esc(s){ return String(s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]}); }
})();
</script>
</body>
</html>
